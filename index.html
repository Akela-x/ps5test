       DARK GLASS STYLE

    * {

    /* ===== PROGRESS ===== */

    #progressWrap {

        0 8px 20px rgba(0, 0, 0, 0.18);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #progressBar {
      position: absolute;

      top: 0;
      left: 0;

      height: 100%;
      width: 100%;

      background:
        -webkit-linear-gradient(
          90deg,
          #315f91 0%,
          #4f9cff 55%,
          #78b5ff 100%
        );

      background:
        linear-gradient(
          90deg,
          #315f91 0%,
          #4f9cff 55%,
          #78b5ff 100%
        );

      -webkit-transform: scaleX(0);
      transform: scaleX(0);

      -webkit-transform-origin: left center;
      transform-origin: left center;

      -webkit-transition:
        -webkit-transform 0.3s ease-out;

      transition:
        transform 0.3s ease-out;

      box-shadow:
        0 0 15px rgba(79, 156, 255, 0.3);
    }

    #progressPct {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: -webkit-box;
      display: -webkit-flex;
      display: flex;

      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;

      -webkit-box-pack: center;
      -webkit-justify-content: center;

      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.7);

    /* ===== LOG ===== */

      white-space: pre-wrap;

      word-wrap: break-word;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    #logContainer.error {
      color: #d5d8df;
    }

    /* =========================================================
       CORRUPTED CACHE OVERLAY
       Same glass visual language
       ========================================================= */

    #cacheCorruptOverlay {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

    #cacheCorruptOverlay h2 {

    #cacheCorruptOverlay p {

    #cacheCorruptOverlay .actions {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;

      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;

      gap: 1rem;

      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
    }

    #cacheCorruptOverlay .actions[hidden] {

    }

    #cacheCorruptOverlay .btn {
      font-size: 1.05rem;

      font-weight: 700;

      padding: 0.75rem 1.5rem;

      border-radius: 12px;

      border: 1px solid rgba(180, 185, 205, 0.15);

    #cacheCorruptOverlay .btn:active {

    #cacheCorruptOverlay .btn.primary {

          #315f91,

      color: #f0f0f0;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);
    }

    #cacheCorruptOverlay .btn.secondary {
      background:
        linear-gradient(
          145deg,
          #383b44,
          #202228
        );

      color: #d5d8df;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.3);
    }

    /* ===== MEMORY CARD ANIMATION ===== */

    .installMemory {
      height: 70px;

      margin: 1.2rem auto 1.5rem;

      display: -webkit-box;
      display: -webkit-flex;
      display: flex;

      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;

      -webkit-box-align: end;
      -webkit-align-items: flex-end;
      align-items: flex-end;

      gap: 12px;
    }

    .installMemory i {
      display: block;

      width: 30px;
      height: 58px;

      border: 1px solid #4f9cff;

      background:
        linear-gradient(
          #46505f,
          #171a21
        );

      box-shadow:
        0 0 18px rgba(79, 156, 255, 0.22);

      animation:
        cardRead 1.15s ease-in-out infinite;
    }

    .installMemory i:nth-child(2) {
      animation-delay: .14s;
    }

    .installMemory i:nth-child(3) {
      animation-delay: .28s;
    }

    .installMemory i:nth-child(4) {
      animation-delay: .42s;
    }

    .installMemory i:nth-child(5) {
      animation-delay: .56s;
    }

    @keyframes cardRead {
      0%,
      100% {
        height: 20px;
        opacity: .35;
      }

      50% {
        height: 58px;
        opacity: 1;
      }
    }

    .installLegend {
      margin-bottom: 1.1rem !important;

      color: #66a8ff !important;

      font-size: .72rem !important;

      letter-spacing: .22em;

    /* ===== MOBILE ===== */

    @media (max-width: 600px) {

      body {

      }

      main {
        width: 94%;
        padding: 35px 18px 32px;
        border-radius: 24px;
      }

        width: 7rem;
        height: 7rem;
      }

      }

      h1:after {

      #status {

      }

      #cacheCorruptOverlay .card {

      }

<body>

  <main>

    Goldengames PS5 Auto Jailbreak v1.1.0 · Based on WebKit Autoloader v0.4.0 by PLK

  <script>
    (function () {
      'use strict';

      var statusEl = document.getElementById('status');
      var detailEl = document.getElementById('detail');
      var progressWrap = document.getElementById('progressWrap');
      var progressBar = document.getElementById('progressBar');
      var progressPct = document.getElementById('progressPct');
      var completed = false;
      var isDownloading = false;
      var isRetry = false;
      var currentUid = '';
      var simulateCorrupt = false;
      var corruptionPromptShown = false;

      (function () {
        var params = new URLSearchParams(window.location.search);
        isRetry = params.get('retry') === '1';
        currentUid = params.get('uid') || '';

        /* Test hook: ?simulate=corrupt forces the corruption prompt without
         * needing a real AppCache error (e.g. for quick UI testing in a
         * desktop browser via `make dev`). */

        simulateCorrupt = params.get('simulate') === 'corrupt';
      })();

      var logContainer = document.getElementById('logContainer');
      var seenLogs = "";

      function appendLog(msg) {
        var div = document.createElement('div');
        div.textContent = msg;
        logContainer.appendChild(div);
        logContainer.scrollTop = logContainer.scrollHeight;
      }


      var logPos = 0;
      var logXhr = null;

      function pollLogs() {
        logXhr = new XMLHttpRequest();

        logXhr.open('GET', '/logs?pos=' + logPos, true);

        logXhr.onreadystatechange = function () {

          if (logXhr.readyState === 4) {

            if (logXhr.status === 200) {

              var newLogs = logXhr.responseText;

              if (newLogs.length > 0) {

                var lines = newLogs.split('\\n');

                for (var i = 0; i < lines.length; i++) {

                  if (lines[i].trim() !== '')
                    appendLog(lines[i]);

                }
              }

              var newPosStr =
                logXhr.getResponseHeader("X-Log-Pos");

              if (newPosStr) {
                logPos = parseInt(newPosStr, 10);
              }

              // Add a slight delay before reconnecting to reduce server load
              setTimeout(pollLogs, 100);

            } else {

              // Server is down or error
              if (completed) return;

              setTimeout(pollLogs, 1000);
            }
          }
        };

        logXhr.send();
      }

      // Start the long-polling loop
      pollLogs();


      var probeOk = false;


      var AUTOLOADER_URL = '/app/index.html';

      function setProgress(pct) {
        progressBar.style.transform =
          'scaleX(' + pct / 100 + ')';

        progressPct.textContent = pct + '%';
      }

      function setInstalled() {
        statusEl.textContent = 'Installed successfully';

        statusEl.style.color = '#22c55e';

        progressBar.style.background =
          '-webkit-linear-gradient(90deg, #16a34a 0%, #22c55e 100%)';

        detailEl.textContent =
          'Goldengames PS5 Auto Jailbreak is now on your PS5 homescreen. You can close this page.';

        setProgress(100);
      }

      function setFailed() {
        statusEl.textContent = 'Install failed';

        statusEl.style.color = '#ef4444';

        progressBar.style.background =
          '-webkit-linear-gradient(90deg, #dc2626 0%, #ef4444 100%)';

        detailEl.textContent =
          'The app could not be installed. Close this page and re-run the installer.';
      }

      function setSlow() {
        statusEl.textContent =
          'Caching is taking unusually long';

        detailEl.textContent =
          'The shortcut is only created after the cache finishes. If this never completes, close the browser and re-run the installer.';
      }

      function setCaching() {
        statusEl.textContent =
          'Caching content...';

        detailEl.textContent =
          'Please wait a moment. Do not close this page yet!';

        progressWrap.hidden = false;
      }

      function goToAutoloader() {
        window.location.replace(AUTOLOADER_URL);
      }

      function probeServer() {

        var xhr = new XMLHttpRequest();

        xhr.open('GET', '/version', true);

        xhr.timeout = 1000;

        xhr.onreadystatechange = function () {

          if (xhr.readyState === 4) {

            if (xhr.status === 200) {

              var hdrUid =
                xhr.getResponseHeader("X-User-Id");

              if (hdrUid)
                currentUid = hdrUid;

              probeOk = true;

              setCaching();

            } else {

              goToAutoloader();

            }
          }
        };

        xhr.onerror = function () {
          goToAutoloader();
        };

        xhr.ontimeout = function () {
          goToAutoloader();
        };

        xhr.send();
      }

      function installApp() {

        var xhr = new XMLHttpRequest();

        xhr.open('GET', '/install', true);

        xhr.timeout = 30000;

        xhr.onreadystatechange = function () {

          if (xhr.readyState === 4) {

            if (xhr.status === 200) {

              setInstalled();

            } else {

              setFailed();

            }
          }
        };

        xhr.onerror = function () {
          setFailed();
        };

        xhr.ontimeout = function () {
          setFailed();
        };

        xhr.send();
      }

      function maybeInstall() {

        if (completed) {
          return;
        }

        completed = true;

        installApp();
      }

      function setCacheCorrupted() {

        if (corruptionPromptShown) {
          return;
        }

        corruptionPromptShown = true;

        completed = true;

        progressWrap.hidden = true;
        logContainer.hidden = true;

        statusEl.textContent = 'Caching failed';
        detailEl.textContent = '';

        var overlay =
          document.createElement('div');

        overlay.id =
          'cacheCorruptOverlay';

        var card =
          document.createElement('div');

        card.className = 'card';

        var title =
          document.createElement('h2');

        var msg =
          document.createElement('p');

        var actions = null;

        var webkitShellPath =
          '/user/home/' +
          (currentUid || '<userid>') +
          '/webkit/shell/';

        if (isRetry) {

          title.textContent =
            'Cache issue persists';

          msg.textContent =
            'Clearing WebKit data from ' +
            webkitShellPath +
            ' didn\'t seem to fix the issue. You can close this page.';

          var exitXhr =
            new XMLHttpRequest();

          exitXhr.open(
            'GET',
            '/exit',
            true
          );

          exitXhr.send();

        } else {

          title.textContent =
            'WebKit cache appears corrupted';

          msg.textContent =
            'Your PS5\'s WebKit browser data may be corrupted, preventing the cache from completing. Clearing it may fix the issue. ';

          var strong =
            document.createElement('strong');

          strong.textContent =
            'This will remove all browser data in ' +
            webkitShellPath +
            ' (AppCache, cookies, local storage) for the current user.';

          msg.appendChild(strong);

          actions =
            document.createElement('div');

          actions.className =
            'actions';

          var clearBtn =
            document.createElement('button');

          clearBtn.className =
            'btn primary';

          clearBtn.textContent =
            'Clear WebKit Data & Retry';

          clearBtn.addEventListener(
            'click',
            function () {

              actions.hidden = true;

              actions.style.display = 'none';

              msg.textContent =
                'Clearing data and restarting browser...';

              var xhr =
                new XMLHttpRequest();

              xhr.open(
                'GET',
                '/clear-webkit-data',
                true
              );

              xhr.timeout = 30000;

              xhr.onreadystatechange =
                function () {

                  if (
                    xhr.readyState === 4 &&
                    xhr.status !== 200
                  ) {

                    msg.textContent =
                      'Failed to clear WebKit data';

                    actions.hidden = false;
                    actions.style.display = '';
                  }
                };

              xhr.onerror = function () {

                msg.textContent =
                  'Failed to clear WebKit data';

                actions.hidden = false;
                actions.style.display = '';
              };

              xhr.ontimeout = function () {

                msg.textContent =
                  'Failed to clear WebKit data';

                actions.hidden = false;
                actions.style.display = '';
              };

              xhr.send();
            }
          );

          actions.appendChild(clearBtn);

          var cancelBtn =
            document.createElement('button');

          cancelBtn.className =
            'btn secondary';

          cancelBtn.textContent =
            'Cancel';

          cancelBtn.addEventListener(
            'click',
            function () {

              msg.textContent =
                'You can close this page. Re-run the installer ELF to try again.';

              actions.hidden = true;

              actions.style.display = 'none';

              var xhr =
                new XMLHttpRequest();

              xhr.open(
                'GET',
                '/exit',
                true
              );

              xhr.send();
            }
          );

          actions.appendChild(cancelBtn);
        }

        card.appendChild(title);

        card.appendChild(msg);

        if (actions) {
          card.appendChild(actions);
        }

        overlay.appendChild(card);

        document.body.appendChild(overlay);
      }

      window.addEventListener(
        'load',
        function () {

          /* Test hook: ?simulate=corrupt forces the corruption prompt as if an
           * AppCache error fired during download, and skips the probe/install
           * polling so the prompt stays up for UI testing (e.g. make dev). */

          if (simulateCorrupt) {

            isDownloading = true;

            setCacheCorrupted();

            return;
          }

          probeServer();

          /* The shortcut is created only once the AppCache is current, so the
             installer never installs a partial cache. /install then both installs
             the homescreen app and stops the server. */

          var waitTimer =
            setInterval(
              function () {

                if (completed) {

                  clearInterval(waitTimer);

                  return;
                }

                if (!probeOk) {

                  clearInterval(waitTimer);

                  goToAutoloader();

                  return;
                }

                var st =
                  window.applicationCache
                    ? window.applicationCache.status
                    : -1;

                if (
                  st === -1 ||
                  st === window.applicationCache.IDLE
                ) {

                  clearInterval(waitTimer);

                  maybeInstall();
                }

              },
              1000
            );

          /* Safety cap — never leave the installer hanging on screen. It does NOT
             install or exit: a partial cache must never create a shortcut, so the
             user simply re-runs the installer if this never completes. */

          setTimeout(
            function () {

              if (!completed && probeOk) {
                setSlow();
              }

            },
            120000
          );
        }
      );


      if (window.applicationCache) {

        window.applicationCache.addEventListener(
          'checking',
          function () {

            progressWrap.hidden = false;

            appendLog(
              "[AppCache] Checking for manifest..."
            );
          }
        );

        window.applicationCache.addEventListener(
          'downloading',
          function () {

            isDownloading = true;

            appendLog(
              "[AppCache] Downloading cache..."
            );
          }
        );

        window.applicationCache.addEventListener(
          'progress',
          function (e) {

            if (e.url)
              appendLog(
                "[AppCache] Fetching: " + e.url
              );

            if (e.total && e.total > 0) {

              var pct =
                Math.min(
                  99,
                  Math.round(
                    (e.loaded / e.total) * 100
                  )
                );

              setProgress(pct);
            }
          }
        );

        window.applicationCache.addEventListener(
          'error',
          function (e) {

            appendLog(
              "[AppCache] Error occurred! Status: " +
              window.applicationCache.status
            );

            logContainer.className =
              'error';

            if (isDownloading) {
              setCacheCorrupted();
            }
          }
        );

        window.applicationCache.addEventListener(
          'obsolete',
          function (e) {

            appendLog(
              "[AppCache] Manifest is obsolete."
            );
          }
        );

        window.applicationCache.addEventListener(
          'cached',
          function() {

            isDownloading = false;

            appendLog(
              "[AppCache] Caching complete."
            );

            maybeInstall();
          }
        );

        window.applicationCache.addEventListener(
          'noupdate',
          function() {

            isDownloading = false;

            appendLog(
              "[AppCache] No update needed."
            );

            maybeInstall();
          }
        );

        window.applicationCache.addEventListener(
          'updateready',
          function () {

            isDownloading = false;

            if (
              window.applicationCache.status ===
              window.applicationCache.UPDATEREADY
            ) {

              window.applicationCache.swapCache();

              window.location.reload();
            }
          }
        );
      }

    })();
  </script>

</body>

</html>
