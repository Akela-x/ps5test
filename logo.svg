<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#172844" stop-opacity=".72"/>
    <stop offset=".5" stop-color="#0b1730" stop-opacity=".56"/>
    <stop offset="1" stop-color="#071020" stop-opacity=".78"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7fb5ff" stop-opacity=".18"/>
    <stop offset=".45" stop-color="#244c91" stop-opacity=".10"/>
    <stop offset="1" stop-color="#6fb9ff" stop-opacity=".20"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e6f3ff"/>
    <stop offset=".45" stop-color="#78aaff"/>
    <stop offset="1" stop-color="#39bfff"/>
  </linearGradient>
  <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#eef7ff"/>
    <stop offset=".55" stop-color="#b9dcff"/>
    <stop offset="1" stop-color="#58bfff"/>
  </linearGradient>
  <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000b1c" flood-opacity=".7"/>
  </filter>
  <clipPath id="panelClip"><rect x="70" y="70" width="884" height="884" rx="112"/></clipPath>
</defs>

<!-- transparent outside the square panel -->

<!-- subtle outer glow -->
<rect x="82" y="82" width="860" height="860" rx="104"
      fill="none" stroke="#218cff" stroke-opacity=".28" stroke-width="24" filter="url(#blurGlow)"/>

<!-- main glass square -->
<rect x="70" y="70" width="884" height="884" rx="112"
      fill="url(#panel)" stroke="url(#edge)" stroke-width="3" filter="url(#shadow)"/>

<!-- glass reflections -->
<g clip-path="url(#panelClip)" opacity=".42">
  <path d="M-40 430 L390 -10 L500 -10 L-40 540Z" fill="#fff" opacity=".045"/>
  <path d="M500 1050 L1050 500 L1050 610 L610 1050Z" fill="#54b7ff" opacity=".06"/>
  <path d="M-20 780 L730 30 L800 30 L40 810Z" fill="#7cb8ff" opacity=".035"/>
</g>

<!-- rear glass panel -->
<rect x="205" y="178" width="614" height="548" rx="48"
      fill="url(#glass)" stroke="#9dcaff" stroke-opacity=".34" stroke-width="2"/>
<rect x="224" y="197" width="576" height="510" rx="39"
      fill="none" stroke="#5ca5ff" stroke-opacity=".16" stroke-width="1"/>

<!-- terminal glow -->
<rect x="230" y="235" width="564" height="500" rx="45"
      fill="#1689ff" opacity=".20" filter="url(#softGlow)"/>

<!-- terminal window -->
<rect x="230" y="220" width="564" height="500" rx="45"
      fill="#071326" fill-opacity=".76" stroke="url(#edge)" stroke-width="3"/>
<rect x="244" y="234" width="536" height="472" rx="35"
      fill="none" stroke="#b9ddff" stroke-opacity=".14" stroke-width="1"/>

<!-- terminal header -->
<path d="M275 220 H749 Q794 220 794 265 V314 H230 V265 Q230 220 275 220Z"
      fill="#1d416f" fill-opacity=".30"/>
<path d="M230 314 H794" stroke="#9fcaff" stroke-opacity=".35" stroke-width="2"/>

<!-- traffic lights -->
<circle cx="276" cy="267" r="13" fill="#26bfff" fill-opacity=".9" stroke="#bcecff" stroke-opacity=".7"/>
<circle cx="316" cy="267" r="13" fill="#75caff" fill-opacity=".75" stroke="#e4f5ff" stroke-opacity=".65"/>
<circle cx="356" cy="267" r="13" fill="#617795" fill-opacity=".75" stroke="#cbd9eb" stroke-opacity=".5"/>

<!-- command prompt -->
<path d="M300 385 L350 425 L300 465" fill="none" stroke="#dff3ff"
      stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
      filter="url(#softGlow)"/>
<path d="M300 385 L350 425 L300 465" fill="none" stroke="#cfeeff"
      stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="373" y="419" width="55" height="11" rx="5.5" fill="#dff4ff"/>

<!-- code gutter -->
<g fill="#7188a8" opacity=".72">
  <circle cx="285" cy="510" r="5"/><circle cx="285" cy="548" r="5"/>
  <circle cx="285" cy="586" r="5"/><circle cx="285" cy="624" r="5"/>
  <circle cx="285" cy="662" r="5"/>
</g>

<!-- abstract code -->
<g stroke-linecap="round">
  <path d="M315 510 H490" stroke="#16c7ff" stroke-width="12"/>
  <path d="M520 510 H655" stroke="#607fae" stroke-width="11"/>
  <path d="M315 548 H375" stroke="#bd6cff" stroke-width="12"/>
  <path d="M398 548 H575" stroke="#7193c8" stroke-width="11"/>
  <path d="M315 586 H585" stroke="#14cfff" stroke-width="12"/>
  <path d="M610 586 H700" stroke="#3e6fae" stroke-width="11"/>
  <path d="M350 624 H455" stroke="#a85cff" stroke-width="11"/>
  <path d="M475 624 H565" stroke="#6484b7" stroke-width="11"/>
  <path d="M315 662 H410" stroke="#14c9f4" stroke-width="12"/>
  <path d="M432 662 H575" stroke="#a35cff" stroke-width="11"/>
  <path d="M598 662 H650" stroke="#5377ac" stroke-width="11"/>
</g>

<!-- left floating code plate -->
<rect x="105" y="470" width="185" height="170" rx="38"
      fill="url(#glass)" stroke="#a8d4ff" stroke-opacity=".55" stroke-width="2"/>
<text x="197" y="575" text-anchor="middle" font-family="ui-monospace,Consolas,monospace"
      font-size="62" font-weight="700" fill="#6ed5ff" filter="url(#softGlow)">{ }</text>
<text x="197" y="575" text-anchor="middle" font-family="ui-monospace,Consolas,monospace"
      font-size="62" font-weight="700" fill="#bdeaff">{ }</text>

<!-- right floating code plate -->
<rect x="738" y="450" width="185" height="170" rx="38"
      fill="url(#glass)" stroke="#a8d4ff" stroke-opacity=".55" stroke-width="2"/>
<text x="830" y="555" text-anchor="middle" font-family="ui-monospace,Consolas,monospace"
      font-size="47" font-weight="700" fill="#63d5ff" filter="url(#softGlow)">&lt;/&gt;</text>
<text x="830" y="555" text-anchor="middle" font-family="ui-monospace,Consolas,monospace"
      font-size="47" font-weight="700" fill="#c9efff">&lt;/&gt;</text>

<!-- bottom glass title plate -->
<rect x="125" y="755" width="774" height="145" rx="45"
      fill="#16305a" fill-opacity=".48" stroke="#a9d6ff" stroke-opacity=".55" stroke-width="2"/>
<rect x="140" y="770" width="744" height="115" rx="35"
      fill="none" stroke="#54a9ff" stroke-opacity=".22"/>

<!-- WEBKIT -->
<text x="512" y="850" text-anchor="middle"
      font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="600"
      letter-spacing="13" fill="#dceeff" stroke="#7fb7ff" stroke-opacity=".25">W<tspan fill="#4dc5ff">E</tspan>BKIT</text>

<!-- underline -->
<circle cx="350" cy="873" r="6" fill="#37c8ff"/>
<path d="M368 873 H675" stroke="#34c9ff" stroke-width="4" stroke-linecap="round"/>
<path d="M675 873 H708" stroke="#b9ecff" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>

<!-- top/bottom accent glows -->
<path d="M280 72 H744" stroke="#63aaff" stroke-width="4" stroke-linecap="round" opacity=".65" filter="url(#softGlow)"/>
<path d="M280 952 H744" stroke="#39bfff" stroke-width="4" stroke-linecap="round" opacity=".6" filter="url(#softGlow)"/>
</svg>