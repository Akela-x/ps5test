<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebKit Autoloader</title>

  <style>
    /* ===== DARK GLASS STYLE ===== */

    * {
      margin: 0;
      padding: 0;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      min-height: 100%;
      background: linear-gradient(135deg, #080a12, #10121d, #151827);
      background-attachment: fixed;
    }

    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;

      background: transparent !important;

      color: #e2e8f0;

      display: -webkit-box;
      display: -webkit-flex;
      display: flex;

      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;

      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;

      min-height: 100%;

      padding: 20px;

      text-align: center;

      position: relative;
    }

    /* ===== BACKGROUND ===== */

    body:before {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(79, 156, 255, 0.08),
          transparent 48%
        );

      z-index: 0;
    }

    /* ===== MAIN GLASS CARD ===== */

    main {
      position: relative;
      z-index: 1;

      width: 90%;
      max-width: 670px;

      box-sizing: border-box;

      padding: 42px 28px 38px;

      background: rgba(30, 32, 45, 0.72);

      border: 1px solid rgba(180, 185, 205, 0.18);

      border-radius: 30px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);

      text-align: center;
    }

    /* ===== STATUS ===== */

    p {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;

      font-size: 1.15rem;

      font-weight: 600;

      line-height: 1.5;

      color: #aeb4c2;

      text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.5);
    }

    p.bad {
      color: #d5d8df;
    }

    /* ===== MOBILE ===== */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      main {
        width: 94%;
        padding: 35px 18px 32px;
        border-radius: 24px;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <main>
    <p id="status">Loading&hellip;</p>
  </main>

  <script>
    (function () {
      'use strict';

      var dir = '1.1.0';
      var version = '1.1.0';
      var statusEl = document.getElementById('status');

      function fail() {
        statusEl.textContent = 'Cache incomplete - run the installer again.';
        statusEl.className = 'bad';
      }

      /* __complete__ is the LAST entry of the AppCache manifest, so if it is
         present (with our version content) every file before it was downloaded.
         Only then point at the app. If the marker is missing, this fetch falls
         back to this very page (content mismatch) or errors - never redirect
         into a partially cached directory. */
      fetch('/app/' + dir + '/__complete__')
        .then(function (r) {
          return r.text();
        })
        .then(function (t) {
          if (t.trim() === version) {
            window.location.replace('/app/' + dir + '/index.html');
          } else {
            fail();
          }
        })
        .catch(fail);
    })();
  </script>

</body>

</html>
